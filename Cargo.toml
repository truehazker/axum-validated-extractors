[package]
name = "axum-validated-extractors"
version = "0.3.0"
edition = "2024"
description = "A collection of validated extractors for Axum that automatically validate the extracted data using the validator crate"
license = "MIT"
repository = "https://github.com/truehazker/axum-validated-extractors"
documentation = "https://docs.rs/axum-validated-extractors"
readme = "README.md"
keywords = ["axum", "validation", "extractors", "web", "http"]
categories = ["web-programming::http-server", "web-programming::http-client"]
authors = ["Egor Orlov <40111175+truehazker@users.noreply.github.com>"]
rust-version = "1.88.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Cargo unifies features, so these are effectively part of the public API: dropping a
# feature here silently breaks downstream crates that declare the same dependency
# without it. Kept as-is for that reason, even though the library itself uses no
# derive macro of its own.
[dependencies]
axum = { version = "0.8.4", features = ["macros"] }
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.16"
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.47.1", features = ["rt", "rt-multi-thread", "macros", "net"] }
tower = { version = "0.5.2", features = ["util"] }
