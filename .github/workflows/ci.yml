name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# Least privilege by default; the publish job needs nothing more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    # ponytail: nightly is advisory only — it breaks on upstream churn, not on our code.
    continue-on-error: ${{ matrix.rust == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, nightly]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

    # Lint gates run once, on stable — beta/nightly lint churn is not a build failure.
    - name: Check formatting
      if: matrix.rust == 'stable'
      run: cargo fmt --all -- --check

    - name: Clippy
      if: matrix.rust == 'stable'
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run tests
      run: cargo test --all-features

    - name: Build documentation
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --no-deps --all-features

  msrv:
    name: MSRV (1.87.0)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
      with:
        toolchain: 1.87.0
    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
    - run: cargo check --all-features

  publish:
    name: Publish
    needs: [test, msrv]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Trusted publishing: crates.io trusts this repo + workflow + environment via OIDC,
    # so there is no long-lived token to store or rotate.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # full history so the "tag is on main" check can resolve ancestry

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
      with:
        toolchain: stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

    # A tag that disagrees with Cargo.toml would publish the wrong version. Refuse it.
    - name: Verify tag matches Cargo.toml version
      env:
        TAG_REF: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        tag="${TAG_REF#v}"
        manifest="$(cargo metadata --format-version 1 --no-deps \
          | jq -r '.packages[] | select(.name=="axum-validated-extractors") | .version')"
        if [ "$tag" != "$manifest" ]; then
          echo "::error::tag $TAG_REF does not match Cargo.toml version $manifest"
          exit 1
        fi

    # Tags land on main only (GitHub Flow). A tag anywhere else must not reach crates.io.
    - name: Verify tag is on main
      env:
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        git fetch --no-tags origin main
        git merge-base --is-ancestor "$SHA" FETCH_HEAD \
          || { echo "::error::tag commit $SHA is not on main"; exit 1; }

    # vX.Y.Z-rc.N is a release candidate: verify it packages, do not publish it.
    - name: Dry run (release candidate)
      if: contains(github.ref_name, '-')
      run: cargo publish --dry-run --all-features

    # Short-lived OIDC-minted token, valid only for this job.
    - name: Authenticate to crates.io
      id: auth
      if: ${{ !contains(github.ref_name, '-') }}
      uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

    - name: Publish to crates.io
      if: ${{ !contains(github.ref_name, '-') }}
      run: cargo publish --all-features
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
